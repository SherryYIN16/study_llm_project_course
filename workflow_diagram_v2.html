<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Hikari Agent 综合教程地图</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #nav-container { width: 90%; max-width: 1200px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; cursor: pointer; background: #ddd; border: none; border-radius: 8px; transition: 0.3s; font-weight: bold; }
        .tab-btn.active { background: #6a5acd; color: white; }
        #content { width: 90%; max-width: 1200px; display: flex; gap: 20px; align-items: flex-start; }
        #left { flex: 2; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); min-height: 450px; display: flex; flex-direction: column; }
        #right { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #6a5acd; height: 100%; box-sizing: border-box; }
        pre { background: #282c34; color: #abb2bf; padding: 15px; border-radius: 8px; font-size: 13px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; }
        #right.hidden { display: none; }
        #left.full-width { flex: 1; }
        .mermaid { background: white !important; }
    </style>
</head>
<body>
    <h1>Hikari Agent 学习地图</h1>
    <div id="nav-container">
        <div class="row">
            <button class="tab-btn active" onclick="showPage('overview', this)">项目概览、目录与核心技术栈</button>
            <button class="tab-btn" onclick="showPage('arch', this)">系统架构图</button>
            <button class="tab-btn" onclick="showPage('io', this)">输入输出规范</button>
            <button class="tab-btn" onclick="showPage('design', this)">设计模式与类结构</button>
            <button class="tab-btn" onclick="showGraph('main', this)">主调度流程</button>
        </div>
        <div class="row">
            <button class="tab-btn" onclick="showGraph('prose', this)">润色工作流</button>
            <button class="tab-btn" onclick="showGraph('podcast', this)">播客工作流</button>
            <button class="tab-btn" onclick="showGraph('mcp', this)">MCP 系统架构</button>
        </div>
    </div>
    
    <div id="content">
        <div id="left"><div id="display-area"></div></div>
        <div id="right">
            <div class="card">
                <h1 style='font-size: 20px; margin-top: 0;'>模式应用统计</h1>
                <ul style='padding-left: 20px; font-size: 14px;'>
                    <li><strong>策略模式</strong>: 1 次记录</li>
                    <li><strong>状态模式</strong>: 1 次记录</li>
                    <li><strong>工厂模式</strong>: 1 次记录</li>
                    <li><strong>数据对象模式</strong>: 1 次记录</li>
                    <li><strong>装饰器模式</strong>: 1 次记录</li>
                </ul>
                <p style='font-size: 13px; color: #666;'>这些模式是构建 Hikari Agent 的基石。</p>
            </div>
        </div>
    </div>

    <script>
        mermaid.initialize({ startOnLoad: true, theme: 'base', themeVariables: { primaryColor: '#e6e6fa', edgeColor: '#6a5acd', fontFamily: 'Segoe UI' } });
        
        const data = {
            overview: { 
                content: '<h2>项目概览</h2><p>Hikari Agent 是一个基于 LangGraph 的智能化 Agent 系统，专用于多 Agent 协作与任务自动化处理。</p>' +
                         '<h2>项目目录</h2><table><thead><tr><th>模块名称</th><th>功能描述</th><th>所在目录</th><th>核心代码</th></tr></thead><tbody>' +
                         '<tr><td>Graph</td><td>业务逻辑与状态机</td><td><code>src/graph</code></td><td>builder.py, nodes.py</td></tr>' +
                         '<tr><td>Agents</td><td>角色定义与行为策略</td><td><code>src/agents</code></td><td>manager.py</td></tr>' +
                         '<tr><td>Tools</td><td>工具集</td><td><code>src/tools</code></td><td>tavily_search.py</td></tr>' +
                         '<tr><td>Server</td><td>MCP 协议接入服务</td><td><code>src/server</code></td><td>fastmcp.py</td></tr>' +
                         '<tr><td>RAG</td><td>文档向量化与检索</td><td><code>src/rag</code></td><td>retriever.py</td></tr>' +
                         '<tr><td>LLMs</td><td>LLM 配置与 API 调用</td><td><code>src/llms</code></td><td>manager.py</td></tr></tbody></table>' +
                         '<h2>核心技术栈</h2><ul><li><strong>LangGraph</strong>: <a href="https://langchain-ai.github.io/langgraph/" target="_blank">官方教程</a></li><li><strong>FastMCP</strong>: <a href="https://modelcontextprotocol.io/" target="_blank">官方教程</a></li></ul>'
            },
            arch: { content: '<h2>系统架构图</h2><pre class="mermaid">graph TD\n    subgraph Core[Core Graph System]\n        builder[src/graph/builder.py]\n        nodes[src/graph/nodes.py]\n        types[src/graph/types.py]\n    end\n    subgraph Agents[Agent Modules]\n        agent_manager[src/agents/agents.py]\n    end\n    subgraph Tools[Crawler & Tools]\n        crawler[src/crawler/crawler.py]\n        tools[src/tools]\n    end\n    subgraph LLM[LLM Management]\n        llm[src/llms/llm.py]\n    end\n    subgraph Server[MCP Server]\n        mcp[src/server/fastmcp.py]\n    end\n    Core --> Agents\n    Core --> LLM\n    Agents --> Tools\n    Agents --> Core\n    mcp --> Core</pre><div class="card" id="arch-desc"><h3 style="color: #6a5acd;">架构设计说明</h3><p style="font-size: 14px;">Hikari Agent 系统架构解析：<br><br>本系统采用分层架构设计，确保了各模块的职责单一且交互清晰。<br><br>1. MCP Server 层 (src/server/fastmcp.py):<br>   作为系统的外部入口，负责与 MCP 协议的兼容与通信，是系统与外部环境进行交互的枢纽。<br><br>2. Core Graph System 层 (src/graph/):<br>   系统的中枢大脑。<br>   - builder.py: 负责构建状态流转图 (Graph Builder)。<br>   - nodes.py: 定义了各功能节点的具体执行逻辑。<br>   - types.py: 定义了系统运行的状态空间与数据结构。<br><br>3. Agent Modules 层 (src/agents/agents.py):<br>   负责 Agent 的生命周期管理与决策逻辑，是系统的执行单元。<br><br>4. LLM Management 层 (src/llms/llm.py):<br>   集中管理大语言模型的配置与 API 调用，实现了 LLM 策略的统一封装。<br><br>5. Crawler & Tools 层 (src/crawler/ & src/tools/):<br>   工具扩展层，包含爬虫模块与其他功能性工具，供 Agent 调用以增强外部获取信息的能力。<br><br>数据流向说明：<br>- MCP Server 发起请求至 Core Graph System。<br>- Core Graph System 作为核心负责驱动 Agent Modules 与 LLM Management 协同工作。<br>- Agent Modules 负责具体的执行与交互，并调用 Crawler & Tools 处理数据。<br>- Agent Modules 亦会反向更新 Core Graph System 的执行状态。<br></p></div>' },
            io: { content: '<h2>输入输出规范</h2><p><strong>输入</strong>: 自然语言任务。</p><p><strong>输出</strong>: 结构化报告。</p>' },
            design: { content: "<div style='font-family: Segoe UI, sans-serif; font-size: 15px; color: #333; line-height: 1.6;'><h1 style='color: #6a5acd;'>设计模式与类结构知识库：Hikari Agent 项目解读</h1><p>作为您的计算机老师，今天我们来剖析一下 Hikari Agent 项目中应用的一些经典编程智慧。理解这些模式，能让您的代码不仅“能跑”，而且“优雅且易于维护”。</p><h3 style='color: #6a5acd;'>1. 工厂模式 (Factory Pattern)</h3><p><strong>文件路径</strong>: <code>src/agents/agents.py</code><br><strong>函数名称</strong>: <code>create_agent</code><br><strong>实现细节</strong>: 此函数根据传入的角色类型，初始化并配置相应的 Agent 实例。确保了对象创建的一致性。</p><p><em>老师点评</em>：有了这个“工厂”，您只需要传入参数，它就能吐出一个配置好的、健壮的 Agent 对象。</p><h3 style='color: #6a5acd;'>2. 数据对象模式 (Data Classes / Pydantic)</h3><p><strong>文件路径</strong>: <code>src/config/configuration.py</code>, <code>src/graph/types.py</code><br><strong>类名称</strong>: <code>Configuration</code>, <code>State</code><br><strong>实现细节</strong>: 使用 Pydantic 定义任务处理的状态空间和配置参数，确保数据的类型安全与结构完整性。</p><p><em>老师点评</em>：使用这些数据类，您不仅拥有了自动校验数据的能力，还拥有了“类型提示”的神器。</p><h3 style='color: #6a5acd;'>3. 状态模式 (State Pattern)</h3><p><strong>文件路径</strong>: <code>src/graph/types.py</code>, <code>src/graph/nodes.py</code><br><strong>实现细节</strong>: <code>State</code> 类作为全局状态存储任务上下文，Node 函数根据状态流转。</p><p><em>老师点评</em>：这使得复杂的任务流程不再是混乱的 if-else，而是条理分明的状态流转。</p><h3 style='color: #6a5acd;'>4. 策略模式 (Strategy Pattern)</h3><p><strong>文件路径</strong>: <code>src/llms/llm.py</code>, <code>src/graph/nodes.py</code><br><strong>函数名称</strong>: <code>get_llm_by_type</code>, <code>planner_node</code><br><strong>实现细节</strong>: 动态切换 LLM 模型或选择不同的 prompt 模板分支。</p><p><em>老师点评</em>：这是解耦业务逻辑与具体实现的利器，新增分析类型只需新增策略分支。</p><h3 style='color: #6a5acd;'>5. 装饰器模式 (Decorator Pattern)</h3><p><strong>文件路径</strong>: <code>src/server/app.py</code>, <code>src/graph/nodes.py</code>, <code>src/tools/decorators.py</code><br><strong>装饰器名称</strong>: <code>@app.post</code>, <code>@tool</code>, <code>@log_io</code><br><strong>实现细节</strong>: 处理路由、工具封装、日志埋点。</p><p><em>老师点评</em>：这让您的主逻辑代码非常纯粹，将辅助逻辑交给装饰器处理。</p></div>" }
        };

        <!-- ONLY_ADD_MAIN_SCHEDULE_TAB_HERE_20260811_UNIQUE -->
        async function setupNodeInteraction() {
            const nodeMap = {
                'support': { info: 'src/graph/nodes.py / support_data_node', desc: '初始化阶段，通过 MCP 工具加载所需的支撑数据。' },
                'coord': { info: 'src/graph/nodes.py / coordinator_node', desc: '人机交互协调者，解析任务需求。' },
                'planner': { info: 'src/graph/nodes.py / planner_node', desc: '核心规划器，生成处理计划。' },
                'team': { info: 'src/graph/nodes.py / research_team_node', desc: '任务分发与协调。' },
                'researcher': { info: 'src/graph/nodes.py / researcher_node', desc: '执行调研任务，调用搜索工具。' },
                'coder': { info: 'src/graph/nodes.py / coder_node', desc: '执行代码分析与 Python 处理。' },
                'reporter': { info: 'src/graph/nodes.py / reporter_node', desc: '整理撰写最终研究报告。' },
                'background': { info: 'src/graph/nodes.py / background_investigation_node', desc: '规划前背景调查。' },
                'human': { info: 'src/graph/nodes.py / human_feedback_node', desc: '反馈计划供用户审查。' }
            };

            // 等待 Mermaid 渲染完成
            setTimeout(() => {
                document.querySelectorAll('.mermaid .node').forEach(node => {
                    node.style.cursor = 'pointer';
                    node.onclick = function() {
                        // 提取 Mermaid ID，例如 "flowchart-support-123" -> "support"
                        const nodeId = this.id.split('-')[1]; 
                        const data = nodeMap[nodeId];
                        
                        if (data) {
                            document.getElementById('right').classList.remove('hidden');
                            document.getElementById('left').classList.remove('full-width');
                            document.getElementById('right').innerHTML = `
                                <div class="card" style="margin-bottom: 20px;">
                                    <h1 style="font-size: 18px;">节点标识</h1>
                                    <p style="font-size: 14px; color: #666;">${data.info}</p>
                                </div>
                                <div class="card">
                                    <h1 style="font-size: 18px;">节点行为</h1>
                                    <p style="font-size: 14px;">${data.desc}</p>
                                </div>
                            `;
                        }
                    };
                });
            }, 500);
        }

        const graphs = {
            main: { def: 'graph TD\nstart(START) --> support(support_data)\nsupport --> coord(coordinator)\ncoord --> planner(planner)\nplanner --> team(research_team)\nteam --> researcher(researcher)\nteam --> coder(coder)\nresearcher --> team\ncoder --> team\nplanner --> reporter(reporter)\nreporter --> END(END)\nplanner --> background(background_investigation)\nbackground --> planner\ncoder --> human(human_feedback)\nhuman --> planner' },
            prose: { def: 'flowchart TD\nInput --> Polish --> Check', nodes: {} },
            podcast: { def: 'flowchart TD\nTopic --> Script --> Audio', nodes: {} },
            mcp: { def: 'flowchart TD\nApp --> Client --> Server', nodes: {} }
        };
        function setActive(btn) { document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active")); btn.classList.add("active"); }
        function showPage(id, btn) {
            setActive(btn);
            const displayArea = document.getElementById("display-area");
            const rightArea = document.getElementById("right");
            displayArea.innerHTML = data[id].content;
            
            if (id === 'arch') {
                const archDesc = displayArea.querySelector('.card');
                if (archDesc) {
                    rightArea.innerHTML = '';
                    rightArea.appendChild(archDesc);
                    rightArea.classList.remove('hidden');
                    document.getElementById('left').classList.remove('full-width');
                }
            } else if (id === 'overview') {
                document.getElementById("right").classList.add("hidden");
                document.getElementById("left").classList.add("full-width");
            } else {
                document.getElementById("right").classList.remove("hidden");
                document.getElementById("left").classList.remove("full-width");
            }
            mermaid.run();
        }
  async function showGraph(type, btn) {
      setActive(btn);
        document.getElementById("right").classList.add("hidden");
        document.getElementById("left").classList.add("full-width");
        document.getElementById("display-area").innerHTML = '<pre class="mermaid">' + graphs[type].def + '</pre>';
        await mermaid.run();
        if (type === 'main') {
            document.getElementById("right").innerHTML = `
                <div class='card' style="margin-bottom: 20px;">
                    <h1 id='node-title' style='font-size: 18px;'>节点标识</h1>
                    <p id='node-desc' style='font-size: 14px; color: #666;'>点击左侧节点查看详情。</p>
                </div>
                <div class='card'>
                    <h1 style='font-size: 18px;'>代码实现</h1>
                    <pre id='code-display'>// 点击左侧节点查看详情...</pre>
                </div>
            `;
            document.getElementById("right").classList.remove("hidden");
            document.getElementById("left").classList.remove("full-width");
            setupNodeInteraction();
        }
   }
        showPage("overview", document.querySelector(".tab-btn"));
    </script>
</body>
</html>
